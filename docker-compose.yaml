# Zmienne środowiskowe wspólne dla aplikacji (php) i zadań cyklicznych (cron).
# Wartości pochodzą z pliku .env (wzór: .env.example); po znaku :- jest wartość domyślna.
x-app-environment: &app-environment
  # w Dockerze baza jest pod nazwą usługi db i portem wewnętrznym 5432
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-app}
  DB_USER: ${POSTGRES_USER:-app}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
  # przy 1 aplikacja odmawia obsługi logowania i rejestracji przez zwykłe HTTP, a ciasteczko sesji jest Secure
  FORCE_HTTPS: ${FORCE_HTTPS:-1}
  # poczta: lokalnie Mailpit (usługa mailpit, port SMTP 1025)
  MAIL_HOST: ${MAIL_HOST:-mailpit}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
  MAIL_FROM: ${MAIL_FROM:-noreply@corvobianco.local}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Corvo Bianco}
  APP_URL: ${APP_URL:-https://localhost:8443}

services:
  server:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:80"
      # HTTPS z certyfikatem samopodpisanym; przy FORCE_HTTPS=1 port 8080 tylko przekierowuje na ten port
      - "${HTTPS_PORT:-8443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
    volumes:
      - .:/app
    links:
      - php
    networks:
      - pg-network

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # skrypty .sql z database/ wykonują się raz, przy pierwszym starcie z pustym wolumenem pg-data
      - ./database:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # composer install pobiera PHPMailera do vendor/ (bind mount ukrywa vendor/ z obrazu); bez sieci zostaje samo dump-autoload.
    # Katalog uploads/wines musi być zapisywalny dla PHP-FPM (www-data); gdy chown się nie uda (niektóre systemy plików
    # Docker Desktop), katalog dostaje prawa dla wszystkich. Błąd któregokolwiek kroku nie blokuje startu php-fpm.
    command: >
      sh -c "(composer install --no-dev --no-interaction --no-progress || composer dump-autoload --no-interaction);
      mkdir -p public/uploads/wines;
      chown -R www-data:www-data public/uploads || chmod -R 0777 public/uploads;
      exec php-fpm"
    volumes:
      - .:/app
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pg-network

  # zadania cykliczne (Lab 13): crond uruchamia bin/send-tasting-reminders.php według docker/cron/crontab
  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    # start.sh instaluje harmonogram z docker/cron/crontab (po usunięciu znaków CR) i uruchamia crond
    command: sh -c "tr -d '\\r' < /app/docker/cron/start.sh > /tmp/start.sh && exec sh /tmp/start.sh"
    volumes:
      - .:/app
    environment:
      <<: *app-environment
      # bez Xdebuga w zadaniach CLI: brak prób łączenia z IDE przy każdym uruchomieniu
      XDEBUG_MODE: "off"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      php:
        condition: service_started
    networks:
      - pg-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - pg-network

  pgadmin-wdpai:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME:-pg-admin}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - pg-network
  
networks:
  pg-network:

volumes:
  pg-data:
