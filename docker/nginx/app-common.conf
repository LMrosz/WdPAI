# Wspólna część obu serwerów (HTTP i HTTPS): katalog aplikacji, PHP-FPM i nagłówki bezpieczeństwa.
root /app/public;
index index.php index.html;

# nie zdradzamy wersji nginx w nagłówku Server i na stronach błędów
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# zdjęcie wina (2 MB) plus reszta formularza; większe żądanie nginx odrzuca kodem 413
client_max_body_size 3m;

# Wgrane zdjęcia: tylko pliki statyczne. Pliku z uploads/ nigdy nie przekazujemy do PHP, nawet gdyby miał rozszerzenie .php
# (location ^~ ma pierwszeństwo przed regułą \.php$ poniżej).
location ^~ /uploads/ {
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

location ~ /\. {
    deny all;
}
