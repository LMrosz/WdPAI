; Xdebug 3: debugowanie krokowe z IDE (port 9003).
; Wyłączenie bez przebudowy obrazu: zmień mode na off i zrestartuj usługę php.
xdebug.mode = debug
; start_with_request = yes: każde żądanie próbuje połączyć się z IDE (gdy IDE nie nasłuchuje, strona działa normalnie)
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
; brak komunikatów o nieudanym połączeniu w logach, gdy IDE nie nasłuchuje
xdebug.log_level = 0
