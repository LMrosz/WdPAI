; Ustawienia bezpieczeństwa PHP (Lab 12). Działają także poza public/index.php (np. przy błędzie składni).
; Błędy nie są wyświetlane na stronie (nie zdradzamy ścieżek, zapytań ani śladu stosu), tylko trafiają do logu kontenera.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; ślad wyjątku w logu bez argumentów funkcji: w argumentach mogłoby być hasło z formularza
zend.exception_ignore_args = On
expose_php = Off
; sesja tylko z ciasteczka, nieznany identyfikator od klienta jest odrzucany
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
